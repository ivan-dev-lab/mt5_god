[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mt5-god"
version = "0.1.0"
description = "Modular MT5 trading automation pipeline driven by image capture, OCR analysis, and UI execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "python-dotenv>=1.0.1,<2.0",
]

[project.optional-dependencies]
telegram = [
  "python-telegram-bot>=21.7,<22.0",
]
vision = [
  "numpy<2",
  "opencv-python<4.13",
  "Pillow>=10.4,<11.0",
  "pytesseract>=0.3.13,<0.4",
  "rapidocr-onnxruntime>=1.4.4,<2.0",
]
ui = [
  "numpy<2",
  "opencv-python<4.13",
  "pyautogui>=0.9.54,<0.10",
  "Pillow>=10.4,<11.0",
  "pytesseract>=0.3.13,<0.4",
  "rapidocr-onnxruntime>=1.4.4,<2.0",
]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
